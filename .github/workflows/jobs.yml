name: Scheduled jobs

# Vercel's free plan runs cron once a day (0 19 * * * UTC = 03:00 in Manila; see
# vercel.json). This workflow adds a 15-minute tick: it expires posts promptly
# and, because the endpoint also reports jobs that stopped running, a stopped
# scheduler makes this run fail and GitHub emails the repository owner.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL      e.g. https://studiskarte-marketplace.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run the frequent jobs and check that every job is healthy
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repository secrets are not set"; exit 1
          fi
          body=$(curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/jobs/run?job=expire-posts,purge-posts,expire-offers,expire-deals,handover-reminders,expiry-warnings")
          echo "$body"
          # "stale" lists jobs that never ran, ran too long ago, or last failed.
          echo "$body" | grep -q '"stale":\[\]' || { echo "A scheduled job is stale"; exit 1; }
