name: Scheduled jobs

# Vercel's free plan runs cron once a day (0 19 * * * UTC = 03:00 in Manila; see
# vercel.json). This workflow adds a 15-minute tick: it expires posts promptly
# and, because the endpoint also reports jobs that stopped running, a stopped
# scheduler makes this run fail and GitHub emails the repository owner.
#
# Once a day (and on manual runs) it also runs the "health" job, which measures
# Gmail sends in the last 24 hours, photo storage and database size. At 80% of
# a free-tier limit the endpoint returns "warnings" and this run fails the same
# way. Daily, not every tick, so an over-limit condition emails once a day
# instead of 96 times.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL      e.g. https://studiskarte-marketplace.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on Vercel

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run the jobs and check that every job is healthy and nothing is near a limit
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET repository secrets are not set"; exit 1
          fi
          jobs="expire-posts,purge-posts,expire-offers,expire-deals,handover-reminders,expiry-warnings"
          if [ "$SCHEDULE" != "*/15 * * * *" ]; then jobs="$jobs,health"; fi
          body=$(curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/jobs/run?job=$jobs")
          echo "$body"
          # "stale" lists jobs that never ran, ran too long ago, or last failed.
          # "warnings" lists quotas and storage near their free-tier limits (health job only).
          problem=0
          echo "$body" | grep -q '"stale":\[\]' || { echo "A scheduled job is stale"; problem=1; }
          echo "$body" | grep -q '"warnings":\[\]' || { echo "Warnings:"; echo "$body" | jq -r '.warnings[]'; problem=1; }
          exit $problem
