<!doctype html>
<html lang="en">
  <head>

    <meta name="theme-color" content="#0365fc" />
    <title>Connection needed · Studiskarte Marketplace</title>
    <!-- Self-contained on purpose: this page is shown when nothing else can load. -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: #171717;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #ededed; }
      }
      main { max-width: 22rem; padding: 2rem 1.5rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
      p { line-height: 1.5; opacity: 0.8; margin: 0 0 1.5rem; }
      button {
        width: 100%;
        min-height: 3rem;
        font-size: 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #0365fc;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Connection needed</h1>
      <p>Studiskarte Marketplace works only when you are online. Check your connection, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
